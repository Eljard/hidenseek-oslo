name: Check and deploy Oslo
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm install --global pnpm@11.25.0
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint:check
            - run: pnpm typecheck
            - run: pnpm test:run
            - run: pnpm build
            - name: Deploy on manual request when configured
              if: github.event_name == 'workflow_dispatch'
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
                    pnpm exec wrangler deploy
                  else
                    echo "Deploy token not configured. Use pnpm deploy with your local Cloudflare login."
                  fi
